<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">










    <link rel="stylesheet" href="estilo.css">



</head>

<body>



    <form action="#" method="get" autocomplete="off" class="form">
        <fieldset class="form__fieldset">
            <legend class="form__title">Cadastra-se</legend>

            <label for="user" class="form__label">Usuário</label>
            <input type="text" name="user" id="user" required class="form__input">


            <label for="email" class="form__label">Email</label>
            <input type="email" name="email" id="email" required class="form__input">



            <label for="password" class="form__label">Senha</label>
            <input type="password" name="password" id="password" required class="form__input">

            <div class="form__action">
                <input type="submit" value="Cadastra-se" class="btn btn-primary">
                <p class="form__action__aside">Já possui cadastro? Faça login
                    <a href="index.html" class="form__action__link">Faça Login</a>
                </p>

            </div>








    </form>
</body>

</html>
