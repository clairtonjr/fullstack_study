<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tables</title>

  <style>
    body {
      font-family: sans-serif;
    }

    table {
      width: 80%;
      margin: auto;
      background-color: beige;
      border-collapse: collapse;
    }

    th {
      background-color: rgb(190, 190, 155);
      border: 2px solid rgb(190, 190, 155);
      padding: 16px;
    }

    td {
      border: 1px solid black;
      text-align: center;
      padding: 10px;
    }
  </style>



</head>

<body>

  <table>
    <caption> Tabela de preço de cursos</caption> <!-- Título da table
    -->

    <thead>
      <tr>
        <th>Área</th>
        <th>Curso</th>
        <th>investimento</th>
      </tr>
    </thead>
    <tr>
      <td rowspan="3"> Design</td>
      <td>InDesign</td>
      <td>R$ 1.000,00</td>
    </tr>

    <tr>

      <td>Photoshop</td>
      <td>R$ 1.000,00</td>
    </tr>

    <tr>

      <td>Illusttrator</td>
      <td>R$ 1.000,00</td>
    </tr>

    <tr>
      <td rowspan="4"> Development</td>
      <td>HTML</td>
      <td>R$ 1.000,00</td>
    </tr>

    <tr>

      <td>CSS</td>
      <td>R$ 1.000,00</td>

    </tr>

    <tr>

      <td>JavaScript</td>
      <td>R$ 1.000,00</td>
    </tr>

    <tr>

      <td>PHP</td>
      <td>R$ 1.000,00</td>
    </tr>
    <tbody>

    </tbody>

    <tfoot>
      <tr>
        <td colspan="3">Valores sujeitos a alterações sem previo aviso </td>
      </tr>
    </tfoot>




  </table>






  
</body>
</html>
