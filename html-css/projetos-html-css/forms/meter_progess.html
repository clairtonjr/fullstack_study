<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meter - Progress</title>
</head>

<body>

    <h1>Meter </h1>
    <label for="combustivel"> Nível do combustivel

    </label>
    <meter min="0" max="100" low="30" high="90" value="25" optimum="50" id="combustivel"></meter>



    <h2>Progress</h2>
    <label> Porcentagem da tarefa


        <progress max="100" value="50"> 50%</progress>

    </label>

    <form oninput="result.value=a.value*b.value">
        <input type="number" name="a" id="a"> X
        <input type="number" name="b" id="b"> =
        <output name="result" for="a b"> </output>

        


    </form>







</body>

</html>
